# The collapse is the point: the workings are still there, and what is left of the way in
# decides who can reach them. Three ways in, because the wall is thin somewhere: the road,
# the road nobody watches, and the one a pick makes. Past the fall there are two: move the
# stone, or be walked around it by somebody who knows the old service crawl.
id: site.collapsed_mine
kind: site-grammar
payload:
  siteType: mine
  restricted: true
  requiredNodes:
    - id: mouth
      socket: mine_mouth
    - id: fall
      affordances:
        - hazard
      socket: mine_fall
    - id: workings
      socket: mine_workings
    - id: face
      affordances:
        - evidence_cache
      socket: mine_face
  optionalNodes:
    - id: flooded_drift
      affordances:
        - hazard
      socket: mine_water
    - id: air_shaft
      affordances:
        - alternate_exit
      socket: mine_shaft
    - id: tool_store
      socket: mine_store
    - id: deeper_cut
      affordances:
        - hazard
      socket: mine_deep
    - id: blind_stope
      affordances:
        - hidden_passage
      socket: mine_hidden
  routes:
    - from: outside
      to: mouth
      via: persuade
      admission: true
    - from: outside
      to: mouth
      via: trespass
      admission: false
    - from: outside
      to: workings
      via: mine_bypass
      admission: false
      affordances:
        - diggable_bypass
    - from: mouth
      to: fall
    - from: mouth
      to: workings
      via: persuade
      admission: true
      affordances:
        - guarded_threshold
    - from: fall
      to: workings
      via: clear_obstruction
      affordances:
        - breakable_barrier
    - from: fall
      to: workings
      via: mine_bypass
      affordances:
        - diggable_bypass
    - from: workings
      to: face
    - from: workings
      to: flooded_drift
    - from: workings
      to: deeper_cut
    - from: mouth
      to: tool_store
      affordances:
        - locked_barrier
    - from: workings
      to: blind_stope
      affordances:
        - hidden_passage
    - from: workings
      to: air_shaft
    - from: air_shaft
      to: outside
