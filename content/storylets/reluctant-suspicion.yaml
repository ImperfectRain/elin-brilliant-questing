id: storylet.reluctant_suspicion
kind: storylet
payload:
  # The brief's own worked example, authored end to end with no wording in it: somebody privately
  # suspects a person they are close to, and does not want to say so. Nothing here makes them
  # reluctant - the tie does, through ActorIntent, which is why a merchant estranged from the same
  # sibling plays the same file as a very different scene.
  situationTags:
    - theft
    - suspicion
  toneTags:
    - private
    - reluctant
  requiredRoles:
    - id: suspicious
      source: AnyoneWhoKnowsFocus
    - id: suspected
      source: FactSubject
  optionalRoles:
    - id: confidant
      source: AnyoneWhoKnowsFocus
  preconditions:
    - kind: FactBelongsToThread
    - kind: FocusPredicate
      value: stole
    - kind: FocusTruth
      value: "True"
    - kind: RoleKnowsFocus
      role: suspicious
    - kind: RoleAlive
      role: suspicious
    - kind: RoleAlive
      role: suspected
  resolutions:
    - said_to_their_face
    - taken_to_somebody_else
    - swallowed
    - settled_between_them
  beats:
    # Whether the matter is raised at all. A warm tie and low boldness reach for the question or
    # for nothing; a cold one reaches for the charge two beats early.
    - id: circles_the_subject
      speaker: suspicious
      listener: suspected
      intentions:
        - act: ask
        - act: inform
        - act: warn
      playerIntersections:
        - question
        - rapport
        - inspect
      check:
        profile: proc_nerve
        actor: suspicious
        target: suspected
        question: can_they_bring_themselves_to_raise_it
      routes:
        - when: check_fail
          ends: swallowed
        - when: spoke
          to: weighs_saying_it
        - when: always
          ends: swallowed

    - id: weighs_saying_it
      speaker: suspicious
      listener: suspected
      intentions:
        - act: accuse
          referent: suspected
        - act: ask
        - act: request
      check:
        profile: proc_persuasion
        actor: suspicious
        target: suspected
        question: can_this_be_said_without_breaking_it
      playerIntersections:
        - persuade
        - compare_testimony
        - question
        - search
      consequences:
        - hook: suspicion_said_to_their_face
          event: AccusationMade
          actor: suspicious
          target: suspected
          magnitude: 0.4
          act: accuse
        - hook: asked_instead_of_accused
          act: ask
      routes:
        - when: check_fail
          act: accuse
          to: takes_it_elsewhere
        - when: always
          act: accuse
          to: hears_the_answer
        - when: spoke
          to: hears_the_answer
        - when: always
          ends: swallowed

    - id: hears_the_answer
      speaker: suspected
      listener: suspicious
      intentions:
        - act: deny
        - act: admit
        - act: offer
        - act: evade
        - act: apologize
      playerIntersections:
        - lie
        - persuade
        - return_item
        - pay_debt
      consequences:
        - hook: suspicion_owned_privately
          event: SecretRevealed
          actor: suspected
          target: suspicious
          magnitude: 0.4
          act: admit
        - hook: suspicion_denied_privately
          act: deny
      routes:
        - when: always
          act: admit
          to: decides_what_it_costs
        - when: always
          act: apologize
          to: decides_what_it_costs
        - when: always
          act: offer
          to: decides_what_it_costs
        - when: always
          ends: said_to_their_face

    - id: decides_what_it_costs
      speaker: suspicious
      listener: suspected
      intentions:
        - act: forgive
          referent: suspected
          content: none
        - act: request
        - act: threaten
        - act: promise
      playerIntersections:
        - persuade
        - report
        - return_item
        - pay_debt
      consequences:
        - hook: kept_between_them
          event: DebtPaid
          actor: suspected
          target: suspicious
          magnitude: 0.3
          act: forgive
        - hook: terms_between_them
          act: request
        - hook: it_went_hard
          event: Threatened
          actor: suspicious
          target: suspected
          magnitude: 0.4
          act: threaten
      routes:
        - when: always
          act: threaten
          ends: said_to_their_face
        - when: spoke
          ends: settled_between_them
        - when: always
          ends: said_to_their_face

    - id: takes_it_elsewhere
      speaker: suspicious
      listener: confidant
      intentions:
        - act: inform
        - act: ask
        - act: request
      playerIntersections:
        - question
        - report
        - invoke_authority
        - rapport
      consequences:
        - hook: suspicion_taken_to_a_third_party
          event: RumorSpread
          actor: suspicious
          target: confidant
          magnitude: 0.2
          act: inform
      routes:
        - when: spoke
          ends: taken_to_somebody_else
        - when: always
          ends: swallowed
  consequenceHooks:
    - record_private_suspicion
