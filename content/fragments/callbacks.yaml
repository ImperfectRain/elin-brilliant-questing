id: fragments.callbacks
kind: dialogueFragments
payload:
  fragments:
    # -- what this conversation has already done. Grounded in the act's own antecedent.
    - id: call.reply.ask
      position: callback
      text: "Since you are the one asking."
      requires:
        reply: ask
      repetitionGroup: callback.reply
    - id: call.reply.accuse
      position: callback
      text: "And you bring that to me."
      requires:
        reply: accuse
      repetitionGroup: callback.reply
    - id: call.reply.request
      position: callback
      text: "You are asking a good deal."
      requires:
        reply: request
      repetitionGroup: callback.reply
    - id: call.reply.threaten
      position: callback
      text: "Now I know what your question was really worth."
      requires:
        reply: threaten
      repetitionGroup: callback.reply
      memorability: signature
    - id: call.reply.threaten.arrived.late
      position: callback
      text: "If you meant to frighten me, you should have arrived earlier."
      requires:
        reply: threaten
      repetitionGroup: callback.reply
      memorability: signature
    - id: call.reply.apologize
      position: callback
      text: "You have said your piece."
      requires:
        reply: apologize
      repetitionGroup: callback.reply
    - id: call.reply.offer
      position: callback
      text: "So that is the shape of it."
      requires:
        reply: offer
      repetitionGroup: callback.reply
    - id: call.reply.gossip
      position: callback
      text: "That is what is going round, at any rate."
      requires:
        reply: gossip
      repetitionGroup: callback.reply
    - id: call.reply.inform
      position: callback
      text: "So that was the news."
      requires:
        reply: inform
      repetitionGroup: callback.reply
    - id: call.reply.deny
      position: callback
      text: "That is what you said."
      requires:
        reply: deny
      repetitionGroup: callback.reply

    # -- old business. The hook is derived from a recorded event and carries the whole of whether
    #    this speaker may know it, so a fragment authored for a kind of history needs no event
    #    written for it anywhere.
    - id: call.history.kindness.mine.listener
      position: callback
      text: "After what I did for you."
      requires:
        callback: kindness
        callback_route: first_hand
        callback_party: listener
      repetitionGroup: callback.history
    - id: call.history.kindness.mine.listener.helped
      position: callback
      text: "You helped me before. I have not mislaid that."
      requires:
        callback: kindness
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
      memorability: voiced
    - id: call.history.kindness.mine.other
      position: callback
      text: "After what I did for {recalled}."
      requires:
        callback: kindness
        callback_route: first_hand
        callback_party: other
      repetitionGroup: callback.history
    - id: call.history.kindness.theirs.listener
      position: callback
      text: "After what you did for me."
      requires:
        callback: kindness
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
    - id: call.history.kindness.old.and.relevant
      position: callback
      text: "An old kindness has just become relevant."
      requires:
        callback: kindness
        callback_route: involved
      repetitionGroup: callback.history
      memorability: signature
    - id: call.history.injury.theirs.listener
      position: callback
      text: "After what you did to me."
      requires:
        callback: injury
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
    - id: call.history.injury.trusted.once
      position: callback
      text: "I trusted you once."
      requires:
        callback: injury
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
      memorability: voiced
    - id: call.history.injury.same.stove
      position: callback
      text: "You are asking me to put my hand on the same stove twice."
      requires:
        callback: injury
        callback_route: involved
        callback_party: listener
        reply:
          - ask
          - request
      repetitionGroup: callback.history
      memorability: signature
    - id: call.history.injury.seen.other
      position: callback
      text: "I saw what {recalled} did."
      requires:
        callback: injury
        callback_route: witnessed
        callback_party: other
      repetitionGroup: callback.history
    - id: call.history.injury.ended.badly
      position: callback
      text: "We have tried this before. It ended badly."
      requires:
        callback: injury
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
      memorability: signature
    - id: call.history.scandal.heard.other
      position: callback
      text: "I know what {recalled} is said to have done."
      requires:
        callback: scandal
        callback_route: heard
        callback_party: other
      repetitionGroup: callback.history
    - id: call.history.scandal.heard.listener
      position: callback
      text: "People still tell that story about you."
      requires:
        callback: scandal
        callback_route: heard
        callback_party: listener
      repetitionGroup: callback.history
      memorability: voiced
    - id: call.history.promise.gave.your.word
      position: callback
      text: "You gave me your word."
      requires:
        callback: promise
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
    - id: call.history.promise.here.because
      position: callback
      text: "I am here about what you promised."
      requires:
        callback: promise
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
      memorability: voiced
    - id: call.history.promise.todays.problem
      position: callback
      text: "Your old promise has become today's problem."
      requires:
        callback: promise
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
      memorability: signature
    - id: call.history.promise.spent.carelessly
      position: callback
      text: "A promise is a cheap thing to make. People spend them carelessly."
      requires:
        callback: promise
        callback_route: involved
      repetitionGroup: callback.history
      memorability: signature
    - id: call.history.promise.mine.first.hand
      position: callback
      text: "I said I would, and I meant it at the time."
      requires:
        callback: promise
        callback_route: first_hand
      repetitionGroup: callback.history
      memorability: voiced
    - id: call.history.embarrassment.listener
      position: callback
      text: "You did that in front of people."
      requires:
        callback: embarrassment
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
      memorability: voiced
    - id: call.history.embarrassment.witnessed
      position: callback
      text: "I was standing there when it happened."
      requires:
        callback: embarrassment
        callback_route: witnessed
      repetitionGroup: callback.history
    - id: call.history.embarrassment.spent
      position: callback
      text: "If humiliation was your method, you have spent it."
      requires:
        callback: embarrassment
        callback_route: involved
        callback_party: listener
      repetitionGroup: callback.history
      memorability: signature
    - id: call.history.lost.object.mine
      position: callback
      text: "I am still short one thing from last time."
      requires:
        callback: lost_object
        callback_route: involved
      repetitionGroup: callback.history
      memorability: voiced
    - id: call.history.lost.object.other
      position: callback
      text: "{recalled} never got theirs back."
      requires:
        callback: lost_object
        callback_route: witnessed
        callback_party: other
      repetitionGroup: callback.history
      memorability: signature
    - id: call.history.this.again
      position: callback
      text: "Old business, then."
      requires:
        callback:
          - injury
          - scandal
          - lost_object
      repetitionGroup: callback.history
    - id: call.history.learned.to.walk
      position: callback
      text: "Apparently that old trouble has learned to walk."
      requires:
        callback:
          - injury
          - scandal
          - lost_object
      voice:
        - wry
      repetitionGroup: callback.history
      memorability: signature

    # -- BQ-151. Recognition before wit: a plain wording for every route a hook can arrive by.
    #
    # The callbacks sweep found the shape of the hole. `scandal` was worded only for `heard`, so a
    # speaker who had *watched* the thing happen fell through to the two kind-agnostic lines below,
    # and the wry one won three rows of seven; `promise`, `kindness` and `embarrassment` reached
    # nothing at all on their unwritten routes, because neither generic line names them. A route
    # with no plain wording is not a quieter callback - it is recognition arriving as a joke, or
    # not arriving.
    #
    # Route is the whole of the difference between these lines, deliberately: doing a thing, having
    # it done to you, standing there while it happened and being told about it afterwards are four
    # different claims about the same event, and a pool that admitted all four would let the words
    # decide which was true. None of them says when it happened, how often, or what it cost - a
    # recalled event is past by construction and the hook carries no magnitude.
    - id: call.history.kindness.saw.it.done
      position: callback
      text: "I saw what you did."
      requires:
        callback: kindness
        callback_route: witnessed
        callback_party: listener
      idiolect:
        - terse
        - literal
      repetitionGroup: callback.history
    - id: call.history.kindness.saw.it.done.other
      position: callback
      text: "I saw what was done for {recalled}."
      requires:
        callback: kindness
        callback_route: witnessed
        callback_party: other
      repetitionGroup: callback.history
    - id: call.history.kindness.was.told
      position: callback
      text: "I was told about that."
      requires:
        callback: kindness
        callback_route: heard
      repetitionGroup: callback.history
    - id: call.history.injury.my.doing
      position: callback
      text: "I know what I did."
      requires:
        callback: injury
        callback_route: first_hand
      idiolect:
        - terse
        - literal
      repetitionGroup: callback.history
    - id: call.history.injury.saw.it.done
      position: callback
      text: "I saw what was done to you."
      requires:
        callback: injury
        callback_route: witnessed
        callback_party: listener
      repetitionGroup: callback.history
    - id: call.history.injury.was.told
      position: callback
      text: "I heard about it afterwards."
      requires:
        callback: injury
        callback_route: heard
      repetitionGroup: callback.history
    - id: call.history.scandal.my.doing
      position: callback
      text: "That was my doing."
      requires:
        callback: scandal
        callback_route: first_hand
      idiolect:
        - terse
        - literal
      repetitionGroup: callback.history
    - id: call.history.scandal.caught.up.in.it
      position: callback
      text: "I was caught up in that one myself."
      requires:
        callback: scandal
        callback_route: involved
      repetitionGroup: callback.history
    - id: call.history.scandal.was.standing.there
      position: callback
      text: "I was there when that came out."
      requires:
        callback: scandal
        callback_route: witnessed
      repetitionGroup: callback.history
    - id: call.history.promise.saw.it.given
      position: callback
      text: "I was there when that was promised."
      requires:
        callback: promise
        callback_route: witnessed
      repetitionGroup: callback.history
    - id: call.history.promise.was.told
      position: callback
      text: "I was told there was a promise in it."
      requires:
        callback: promise
        callback_route: heard
      repetitionGroup: callback.history
    - id: call.history.embarrassment.my.doing
      position: callback
      text: "That was my doing, and it was badly done."
      requires:
        callback: embarrassment
        callback_route: first_hand
      repetitionGroup: callback.history
    - id: call.history.embarrassment.was.told
      position: callback
      text: "Word of that reached me."
      requires:
        callback: embarrassment
        callback_route: heard
      repetitionGroup: callback.history
    - id: call.history.lost.object.my.doing
      position: callback
      text: "I had a hand in that going missing."
      requires:
        callback: lost_object
        callback_route: first_hand
      repetitionGroup: callback.history
    - id: call.history.lost.object.was.told
      position: callback
      text: "I was told it never turned up."
      requires:
        callback: lost_object
        callback_route: heard
      repetitionGroup: callback.history

    # The floor under all of the above, and the reason the route lines can be specific. Every one of
    # these is written for all six kinds, takes no position on the route and names nobody, so a hook
    # whose other side the world can no longer produce - or never had one - still has plain wording
    # rather than falling to the two lines that happen to be kind-agnostic. `this.again` above was
    # that floor for three kinds; a promise, a kindness or an embarrassment reached nothing.
    #
    # None of them says the listener was party to it. A hook carries who the other side is on
    # `callback_party`, and a line that says "between us" without asking is wording deciding that
    # the person in the room was there.
    - id: call.history.plain.given.what.happened
      position: callback
      text: "Given what happened."
      requires:
        callback:
          - promise
          - kindness
          - injury
          - embarrassment
          - scandal
          - lost_object
      idiolect:
        - terse
        - clipped
      repetitionGroup: callback.history
    - id: call.history.plain.history.behind.this
      position: callback
      text: "There is history behind this."
      requires:
        callback:
          - promise
          - kindness
          - injury
          - embarrassment
          - scandal
          - lost_object
      idiolect:
        - literal
      repetitionGroup: callback.history
    - id: call.history.plain.not.put.aside
      position: callback
      text: "I have not put that aside."
      requires:
        callback:
          - promise
          - kindness
          - injury
          - embarrassment
          - scandal
          - lost_object
      repetitionGroup: callback.history
