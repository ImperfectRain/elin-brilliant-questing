id: fragments.modifiers.relationship
kind: dialogueFragments
payload:
  fragments:
    # What the speaker is to the person opposite, and only that. The graph decided it; this reads
    # it. A stranger's line and a spouse's line are not two depths of one sentence.
    - id: mod.tie.stranger.trust.first
      position: modifier
      text: "You are asking for trust before introducing a reason."
      requires:
        act:
          - refuse
          - evade
          - deny
          - ask
        relationship: none
      voice:
        - formal
      repetitionGroup: tie
      memorability: signature
    - id: mod.tie.stranger.not.well.enough
      position: modifier
      text: "I do not know you well enough for that answer."
      requires:
        act:
          - refuse
          - evade
          - answer
        relationship: none
      repetitionGroup: tie
    - id: mod.tie.stranger.earn.the.second
      position: modifier
      text: "Start with your name. Then earn the second question."
      requires:
        act:
          - refuse
          - evade
          - ask
        relationship: none
      voice:
        - curt
      repetitionGroup: tie
      memorability: signature
    - id: mod.tie.acquaintance.past.introductions
      position: modifier
