      memorability: voiced
    - id: mod.tie.enemy.remember.what.you.did
      position: modifier
      text: "I remember what you did."
      requires:
        act:
          - refuse
          - accuse
          - threaten
          - deny
        relationship: enemy
        callback: injury
        callback_route: involved
        callback_party: listener
      repetitionGroup: tie
      memorability: signature
    - id: mod.tie.creditor.not.disappeared
      position: modifier
      text: "The debt between us did not disappear because today is inconvenient."
      requires:
        act:
          - refuse
          - request
          - threaten
        relationship: creditor
      repetitionGroup: tie
      memorability: signature
    - id: mod.tie.creditor.something.useful
