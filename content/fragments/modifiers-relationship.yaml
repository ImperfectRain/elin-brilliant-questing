      repetitionGroup: tie
      memorability: signature
    - id: mod.tie.accomplice.both.of.us
      position: modifier
      text: "Whatever lands on you lands on me. Remember that."
      requires:
        act:
          - warn
          - threaten
          - request
          - deny
        relationship: accomplice
      repetitionGroup: tie
      memorability: signature

    # -- BQ-151. The plain half of every tie above.
    #
    # A tie the library can only word memorably is a tie the world can only ever say strikingly,
    # and this slot fires in every act. Each line below is utility on purpose and each covers the
    # acts its memorable sibling covers, so the strong reading of a relationship stays an
    # alternative rather than the whole of it. Cadence rather than synonym: fragments, plain
    # declaratives, qualification before and after the point, a conclusion with its practical
    # consequence.
    #
    # Nothing here asserts more than `relationship` already guarantees. No line claims what the
    # listener knows, remembers or has done before; no line carries `again`, `still` or `always`,
    # because the tie says who two people are to each other and says nothing about how often.
    - id: mod.tie.stranger.plain.a.stranger
      position: modifier
      text: "You are a stranger to me."
      requires:
        act:
          - refuse
          - evade
          - deny
          - answer
        relationship: none
      idiolect:
        - terse
        - literal
      repetitionGroup: tie
    - id: mod.tie.stranger.plain.what.a.stranger.may
      position: modifier
      text: "Ask me what a stranger may be asked."
      requires:
        act:
          - ask
          - request
          - inform
        relationship: none
      repetitionGroup: tie
    - id: mod.tie.acquaintance.plain.only.so.far
