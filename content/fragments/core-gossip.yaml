id: fragments.core.gossip
kind: dialogueFragments
payload:
  fragments:
    - id: core.gossip.heard.something
      position: core
      text: "I heard something about {referent}."
      requires:
        act: gossip
        referent: other
        claim_source: hearsay
      repetitionGroup: gossip
    - id: core.gossip.people.talking
      position: core
      text: "This may be nothing, but {referent} has people talking."
      requires:
        act: gossip
        referent: other
        claim_source: hearsay
      repetitionGroup: gossip
    - id: core.gossip.not.the.only.one
      position: core
      text: "I cannot prove it. It did not start with me."
      requires:
        act: gossip
        claim_proof: "no"
        claim_source: hearsay
      repetitionGroup: gossip
    - id: core.gossip.smoke.not.fire
      position: core
      text: "Treat it as smoke rather than fire."
      requires:
        act: gossip
        commitment: hedged
      repetitionGroup: gossip
      memorability: voiced
    - id: core.gossip.better.clothes
      position: core
      text: "This reached me secondhand, and secondhand things arrive well dressed."
      requires:
        act: gossip
        claim_source: hearsay
      tone:
        - wry
      repetitionGroup: gossip
      memorability: signature
    - id: core.gossip.theft.matter
      position: core
      text: "They are saying {referent} took the {matter}."
      requires:
        act: gossip
        referent: other
        claim_predicate: stole
        claim_source: hearsay
      repetitionGroup: gossip.theft
    - id: core.gossip.theft.pockets
      position: core
      text: "Word is the {matter} left in {referent}'s pocket."
      requires:
        act: gossip
        referent: other
        claim_predicate: stole
        claim_source: hearsay
      repetitionGroup: gossip.theft
      memorability: voiced
    - id: core.gossip.public.everyone.knows
      position: core
      text: "I am not going to pretend this is a secret."
      requires:
        act: gossip
        audience: several
      repetitionGroup: gossip.spread
    - id: core.gossip.private.between.us.two
      position: core
      text: "You did not hear this from me."
      requires:
        act: gossip
        audience: one
      repetitionGroup: gossip.spread
      memorability: voiced
    - id: core.gossip.suspicion.arrived.neatly
      position: core
      text: "It arrived very neatly, that story."
      requires:
        act: gossip
        claim_source: hearsay
        emotion: suspicion
      repetitionGroup: gossip.spread
      memorability: voiced

    - id: core.gossip.small.town
      position: core
      text: "It is about {referent}, and you may as well hear it now."
      requires:
        act: gossip
        referent: other
      repetitionGroup: gossip
    - id: core.gossip.two.versions
      position: core
      text: "That is one version of {referent}. I would not swear it is the only one."
      requires:
        act: gossip
        referent: other
        commitment: hedged
      repetitionGroup: gossip
      memorability: voiced
    - id: core.gossip.would.not.repeat
      position: core
      text: "I would not repeat it if I thought it was nothing."
      requires:
        act: gossip
        claim_source: hearsay
      repetitionGroup: gossip
      memorability: voiced
