name: Core

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Core tests
        run: dotnet restore tests/BrilliantQuesting.Core.Tests/BrilliantQuesting.Core.Tests.csproj

      - name: Build Core tests
        run: dotnet build tests/BrilliantQuesting.Core.Tests/BrilliantQuesting.Core.Tests.csproj --no-restore

      - name: Run Core tests
        run: dotnet test tests/BrilliantQuesting.Core.Tests/BrilliantQuesting.Core.Tests.csproj --no-build

      - name: Test Lab harnesses
        run: dotnet test tests/BrilliantQuesting.Lab.Tests/BrilliantQuesting.Lab.Tests.csproj

      - name: Report anti-template repetition
        run: dotnet run --no-build --project tools/BrilliantQuesting.Lab -- run anti-template --seed 15 --runs 20 > anti-template-profile.json

      - name: Retain repetition profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-template-profile
          path: anti-template-profile.json
          if-no-files-found: error
